  .msg{margin-top:10px;padding:10px;border-radius:10px;text-align:center;font-weight:700;display:none}
  .msg.p1{display:block;background:#e0e7ff;color:#3730a3}
  .msg.p2{display:block;background:#d1fae5;color:#065f46}
  .msg.near{display:block;background:#fff7ed;color:#9a3412}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{background:#e2e8f0;color:var(--ink);padding:7px 10px;font-size:.85rem}
  .tab.on{background:var(--ink);color:#fff}
  .step{display:none;padding:10px 12px;border-left:4px solid var(--line);margin:8px 0;background:#f8fafc;border-radius:6px;animation:fade .35s}
  .step.show{display:block}
  .step h3{margin:0 0 4px;font-size:.95rem}
  .math{font-family:&quot;Cambria Math&quot;,&quot;Times New Roman&quot;,serif;font-size:1.08rem}
  .ans{border-left-color:var(--p1)} .ans2{border-left-color:var(--p2)}
  .key{border-left-color:var(--warn);background:#fff7ed}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .quiz .q{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .quiz input{width:70px;font:inherit;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;text-align:right}
  .quiz input:focus{outline:2px solid var(--b);border-color:transparent}
  .quiz .unit{font-weight:700;margin-right:8px}
  .quiz .r{font-weight:700;margin-left:6px}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class=&quot;wrap&quot;>
  <header>
    <div style=&quot;display:inline-block;margin:2px 0 6px;padding:4px 12px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:700;font-size:.95rem;border:1px solid #fcd34d&quot;>&amp;#128214; 教科書：練習27（p.160）　解説・確認編</div><h1>三角形の決定 ― 練習（解が2つある場合）</h1>
    <p>点 B をドラッグして、条件を満たす三角形を探してみよう。</p>
  </header>

  <div class=&quot;grid&quot;>
    <section class=&quot;card&quot;>
      <div class=&quot;problem&quot;>
        △ABC において <span class=&quot;cb&quot;>b = 2</span>，<span class=&quot;cc&quot;>c = √2</span>，<b>C = 30°</b> のとき，<span class=&quot;ca&quot;>a</span>，A，B を求めよ。
      </div>
      <canvas id=&quot;cv&quot; width=&quot;800&quot; height=&quot;480&quot; aria-label=&quot;三角形の図。点Bをドラッグできます&quot;></canvas>
      <p class=&quot;hint&quot;>💡 赤い点 B をドラッグ（またはスライダー）。点 B は点 A を中心とする半径 c = √2 の円周上を動きます。</p>
      <input type=&quot;range&quot; id=&quot;slider&quot; min=&quot;0&quot; max=&quot;360&quot; step=&quot;0.5&quot; value=&quot;270&quot; aria-label=&quot;辺cの向き&quot;>

      <div class=&quot;stats&quot;>
        <div class=&quot;stat&quot;><small>C（条件 30°）</small><b id=&quot;vC&quot;>--</b></div>
        <div class=&quot;stat&quot;><small>A</small><b id=&quot;vA&quot;>--</b></div>
        <div class=&quot;stat&quot;><small>B</small><b id=&quot;vB&quot;>--</b></div>
        <div class=&quot;stat&quot;><small>a</small><b id=&quot;va&quot;>--</b></div>
      </div>
      <div id=&quot;msg&quot; class=&quot;msg&quot;></div>

      <div class=&quot;row&quot;>
        <button class=&quot;btn1&quot; id=&quot;go1&quot;>解1へ移動（B₁）</button>
        <button class=&quot;btn2&quot; id=&quot;go2&quot;>解2へ移動（B₂）</button>
        <button class=&quot;btn4&quot; id=&quot;anim&quot;>▶ 自動で1周</button>
        <button class=&quot;btn3&quot; id=&quot;reset&quot;>リセット</button>
      </div>
      <div class=&quot;toggles&quot;>
        <label><input type=&quot;checkbox&quot; id=&quot;tCand&quot;> 答えの位置（B₁, B₂）を表示</label>
        <label><input type=&quot;checkbox&quot; id=&quot;tH&quot;> 点 A からの垂線（高さ）を表示</label>
        <label><input type=&quot;checkbox&quot; id=&quot;tBoth&quot;> 2つの三角形を重ねて表示</label>
      </div>
    </section>

    <section class=&quot;card&quot;>
      <div class=&quot;tabs&quot;>
        <button class=&quot;tab on&quot; data-t=&quot;quiz&quot;>① 自分で解く</button>
        <button class=&quot;tab&quot; data-t=&quot;cos&quot;>② 余弦定理で</button>
        <button class=&quot;tab&quot; data-t=&quot;mix&quot;>③ 余弦＋正弦</button>
        <button class=&quot;tab&quot; data-t=&quot;sin&quot;>④ 別解（正弦から）</button>
      </div>

      <div id=&quot;p-quiz&quot; class=&quot;pane quiz&quot;>
        <p>図で確かめる前に、答えを数値で入力してみよう（a は小数の近似値で OK）。</p>
        <p class=&quot;q&quot;>解1：a ≈ <input id=&quot;q1&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解1のa&quot;><span class=&quot;unit&quot;></span>
          A = <input id=&quot;q2&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解1の角A&quot;><span class=&quot;unit&quot;>°</span>
          B = <input id=&quot;q3&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解1の角B&quot;><span class=&quot;unit&quot;>°</span>
          <span class=&quot;r&quot; id=&quot;r1&quot;></span></p>
        <p class=&quot;q&quot;>解2：a ≈ <input id=&quot;q4&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解2のa&quot;><span class=&quot;unit&quot;></span>
          A = <input id=&quot;q5&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解2の角A&quot;><span class=&quot;unit&quot;>°</span>
          B = <input id=&quot;q6&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; aria-label=&quot;解2の角B&quot;><span class=&quot;unit&quot;>°</span>
          <span class=&quot;r&quot; id=&quot;r2&quot;></span></p>
        <button class=&quot;btn1&quot; id=&quot;check&quot;>答え合わせ</button>
        <div class=&quot;step key show&quot; style=&quot;margin-top:14px&quot;>
          <h3>🔎 なぜ解が2つあるの？</h3>
          点 A から辺 CB（の延長）までの高さは <span class=&quot;math&quot;>h = b sin C = 2 · (1/2) = 1</span>。<br>
          <span class=&quot;math&quot;>h &amp;lt; c &amp;lt; b</span>（1 &amp;lt; 1.41 &amp;lt; 2）なので，<span class=&quot;math&quot;>h &amp;lt; c</span> より半径 c の円が直線と<b>2点で交わり</b>，さらに <span class=&quot;math&quot;>c &amp;lt; b</span> より2つの交点がどちらも点 C の右側（C = 30° 側）にできる。<br>
          「点 A からの垂線」を表示して確かめよう。
        </div>
      </div>

      <div id=&quot;p-cos&quot; class=&quot;pane&quot; style=&quot;display:none&quot;>
        <div class=&quot;steps&quot; data-g=&quot;cos&quot;>
          <div class=&quot;step show&quot;><h3>Step 1　余弦定理を立てる</h3>
            <span class=&quot;math&quot;>c² = a² + b² − 2ab cos C</span></div>
          <div class=&quot;step&quot;><h3>Step 2　値を代入</h3>
            <span class=&quot;math&quot;>2 = a² + 4 − 2·a·2·(√3/2)</span><br>
            <span class=&quot;math&quot;>a² − 2√3 a + 2 = 0</span></div>
          <div class=&quot;step&quot;><h3>Step 3　解の公式（場合分け）</h3>
            <span class=&quot;math&quot;>a = √3 ± √(3 − 2) = √3 ± 1</span><br>どちらも正 → <b>両方とも三角形になる！</b></div>
          <div class=&quot;step ans&quot;><h3>Step 4　(i) a = √3 + 1 のとき</h3>
            <span class=&quot;math&quot;>cos B = (c² + a² − b²) / (2ca) = (2 + 2√3) / {2√2(√3 + 1)} = 1/√2</span><br>
            → <b>B = 45°，A = 105°</b></div>
          <div class=&quot;step ans2&quot;><h3>Step 5　(ii) a = √3 − 1 のとき</h3>
            <span class=&quot;math&quot;>cos B = (2 − 2√3) / {2√2(√3 − 1)} = −1/√2</span><br>
            → <b>B = 135°，A = 15°</b></div>
        </div>
        <div class=&quot;row&quot;><button class=&quot;btn3 next&quot; data-g=&quot;cos&quot;>次のステップ ▶</button></div>
      </div>

      <div id=&quot;p-mix&quot; class=&quot;pane&quot; style=&quot;display:none&quot;>
        <div class=&quot;steps&quot; data-g=&quot;mix&quot;>
          <div class=&quot;step show&quot;><h3>Step 1　まず余弦定理で a を求める</h3>
            <span class=&quot;math&quot;>c² = a² + b² − 2ab cos C</span> より <span class=&quot;math&quot;>a² − 2√3 a + 2 = 0</span><br>
            → <b>a = √3 ± 1</b>（②の Step 1〜3 と同じ）</div>
          <div class=&quot;step&quot;><h3>Step 2　正弦定理で sin B を求める</h3>
            <span class=&quot;math&quot;>b / sin B = c / sin C</span> より<br>
            <span class=&quot;math&quot;>sin B = b sin C / c = 2 · (1/2) / √2 = 1/√2</span></div>
          <div class=&quot;step key&quot;><h3>Step 3　⚠ B の候補は2つ</h3>
            C = 30° なので <span class=&quot;math&quot;>B + C &amp;lt; 180°</span> より <span class=&quot;math&quot;>0° &amp;lt; B &amp;lt; 150°</span>。<br>
            この範囲で sin B = 1/√2 となるのは <b>B = 45° と B = 135°</b>。辺と角の大小関係で a と対応づける。</div>
          <div class=&quot;step ans&quot;><h3>Step 4　(i) a = √3 + 1 のとき</h3>
            <span class=&quot;math&quot;>b &amp;lt; a</span>（2 &amp;lt; √3 + 1）より <span class=&quot;math&quot;>B &amp;lt; A</span> なので B は鋭角<br>
            → <b>B = 45°，A = 105°</b></div>
          <div class=&quot;step ans2&quot;><h3>Step 5　(ii) a = √3 − 1 のとき</h3>
            <span class=&quot;math&quot;>a &amp;lt; c &amp;lt; b</span> で <span class=&quot;math&quot;>c² + a² = 6 − 2√3 &amp;lt; 4 = b²</span> より B は鈍角<br>
            → <b>B = 135°，A = 15°</b></div>
        </div>
        <div class=&quot;row&quot;><button class=&quot;btn3 next&quot; data-g=&quot;mix&quot;>次のステップ ▶</button></div>
      </div>

      <div id=&quot;p-sin&quot; class=&quot;pane&quot; style=&quot;display:none&quot;>
        <div class=&quot;steps&quot; data-g=&quot;sin&quot;>
          <div class=&quot;step show&quot;><h3>Step 1　正弦定理から始める（別解）</h3>
            <span class=&quot;math&quot;>b / sin B = c / sin C</span> より <span class=&quot;math&quot;>sin B = b sin C / c = 1/√2</span></div>
          <div class=&quot;step key&quot;><h3>Step 2　⚠ B の候補が2つ出る</h3>
            C = 30°（<span class=&quot;math&quot;>0° &amp;lt; B &amp;lt; 150°</span>）より <b>B = 45° と B = 135° の2つとも適する</b>。<br>
            ※ sin 105° や sin 15° は数学Ⅰの範囲外なので，a は図の垂線 AH（または余弦定理）で求める。</div>
          <div class=&quot;step&quot;><h3>Step 3　点 A から直線 CB に垂線 AH を引く</h3>
            直角三角形 ACH（C = 30°，b = 2）より <span class=&quot;math&quot;>CH = √3，AH = 1</span></div>
          <div class=&quot;step ans&quot;><h3>Step 4　(i) B = 45° のとき</h3>
            <b>A = 105°</b>。直角二等辺三角形 ABH（AH = 1，B = 45°）より <span class=&quot;math&quot;>HB = 1</span><br>
            → <b>a = CH + HB = √3 + 1</b></div>
          <div class=&quot;step ans2&quot;><h3>Step 5　(ii) B = 135° のとき</h3>
            <b>A = 15°</b>。∠ABH = 45° より <span class=&quot;math&quot;>HB = 1</span>（点 B は線分 CH 上）<br>
            → <b>a = CH − HB = √3 − 1</b></div>
        </div>
        <div class=&quot;row&quot;><button class=&quot;btn3 next&quot; data-g=&quot;sin&quot;>次のステップ ▶</button></div>
      </div>
    </section>
  </div>
  <footer>数学Ⅰ 図形と計量 ― 三角形の決定（2つの解）</footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), slider = $('slider');
  const W = 800, H = 480;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  const S = 150, OX = 130, OY = 400;
  const R3 = Math.sqrt(3), RC = Math.SQRT2;
  const X = x => OX + x * S, Y = y => OY - y * S;
  const Cp = {x:0, y:0}, Ap = {x:R3, y:1};
  const SOL = [
    {deg:315, x:R3+1, A:105, B:45,  a:'√3 + 1', col:'#4f46e5', bg:'rgba(79,70,229,.12)', name:'解1'},
    {deg:225, x:R3-1, A:15,  B:135, a:'√3 − 1', col:'#059669', bg:'rgba(5,150,105,.14)', name:'解2'}];
  const SNAP = 2.5;

  const posOf = deg => { const t = deg*Math.PI/180; return {x:Ap.x+RC*Math.cos(t), y:Ap.y+RC*Math.sin(t)}; };
  const ang = (ux,uy,vx,vy) => Math.acos(Math.max(-1,Math.min(1,(ux*vx+uy*vy)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)))))*180/Math.PI;

  function line(p,q,col,w,dash){ctx.beginPath();ctx.setLineDash(dash||[]);ctx.moveTo(X(p.x),Y(p.y));ctx.lineTo(X(q.x),Y(q.y));
    ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();ctx.setLineDash([]);}
  function dot(p,col,r){ctx.beginPath();ctx.arc(X(p.x),Y(p.y),r,0,7);ctx.fillStyle=col;ctx.fill();}
  function text(s,x,y,col,size,bold){ctx.font=`${bold?'bold ':''}${size}px &quot;Hiragino Sans&quot;,&quot;Yu Gothic UI&quot;,Meiryo,sans-serif`;ctx.fillStyle=col;ctx.fillText(s,x,y);}
  function tri(B,fill){ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(Ap.x),Y(Ap.y));ctx.lineTo(X(B.x),Y(B.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();}

  function draw(){
    const deg = parseFloat(slider.value);
    const B = posOf(deg);
    const snapped = SOL.find(s => Math.abs(deg - s.deg) < 0.01);
    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle='#f1f5f9';ctx.lineWidth=1;
    for(let gx=OX%30;gx<W;gx+=30){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
    for(let gy=OY%30;gy<H;gy+=30){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

    line({x:-0.5,y:0},{x:4.4,y:0},'#94a3b8',2,[6,6]);
    ctx.beginPath();ctx.setLineDash([6,6]);ctx.arc(X(Ap.x),Y(Ap.y),RC*S,0,7);ctx.strokeStyle='#fca5a5';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);

    if($('tBoth').checked){ SOL.forEach(s=>{const P={x:s.x,y:0};tri(P,s.bg);line(Ap,P,s.col,2,[4,4]);}); }
    else if(snapped){ tri(B, snapped.bg); }

    if($('tH').checked){
      line(Ap,{x:R3,y:0},'#ea580c',2,[3,4]);
      ctx.strokeStyle='#ea580c';ctx.lineWidth=1.5;ctx.strokeRect(X(R3),Y(0)-12,12,12);
      text('h = 1',X(R3)+8,Y(0.5),'#ea580c',16,true);
      text('H',X(R3)-6,Y(0)+24,'#ea580c',16,true);
    }
    if($('tCand').checked || $('tBoth').checked){
      SOL.forEach((s,i)=>{dot({x:s.x,y:0},s.col,7);text(i?'B₂':'B₁',X(s.x)-10,Y(0)+28,s.col,17,true);});
    }

    line(Cp,Ap,'#2563eb',4); line(Ap,B,'#dc2626',4); line(Cp,B,'#16a34a',4);
    ctx.beginPath();ctx.arc(X(0),Y(0),40,0,-Math.PI/6,true);ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.stroke();
    text('30°',X(0)+46,Y(0)-6,'#1e293b',15);

    dot(Cp,'#1e293b',6); dot(Ap,'#1e293b',6);
    ctx.beginPath();ctx.arc(X(B.x),Y(B.y),14,0,7);ctx.fillStyle='rgba(220,38,38,.18)';ctx.fill();
    dot(B,'#dc2626',8);

    text('C',X(0)-26,Y(0)+22,'#1e293b',22,true);
    text('A',X(Ap.x)-8,Y(Ap.y)-16,'#1e293b',22,true);
    text('B',X(B.x)+16,Y(B.y)-12,'#dc2626',22,true);
    text('b = 2',X(Ap.x/2)-40,Y(Ap.y/2)-14,'#2563eb',17,true);
    text('c = √2',X((Ap.x+B.x)/2)+14,Y((Ap.y+B.y)/2)+6,'#dc2626',17,true);
    text('a',X(B.x/2)-4,Y(B.y/2)+(Math.abs(B.y)<0.3?26:-10),'#16a34a',18,true);

    update(B,deg,snapped);
  }

  function update(B,deg,s){
    const vC=$('vC'),vA=$('vA'),vB=$('vB'),va=$('va'),msg=$('msg');
    if(s){
      vC.textContent='30°';vC.className='';vA.textContent=s.A+'°';vB.textContent=s.B+'°';va.textContent=s.a;
      msg.className='msg '+(s.deg===315?'p1':'p2');
      msg.textContent=`🎉 ${s.name}：a = ${s.a}，A = ${s.A}°，B = ${s.B}°`;
      return;
    }
    const a=Math.hypot(B.x,B.y);
    if(a<1e-6){vC.textContent=vA.textContent=vB.textContent='--';va.textContent='0';msg.className='msg';return;}
    const c=ang(B.x,B.y,Ap.x,Ap.y);
    vC.textContent=c.toFixed(1)+'°'; vC.className=Math.abs(c-30)<0.5?'':'off';
    vA.textContent=ang(-Ap.x,-Ap.y,B.x-Ap.x,B.y-Ap.y).toFixed(1)+'°';
    vB.textContent=ang(-B.x,-B.y,Ap.x-B.x,Ap.y-B.y).toFixed(1)+'°';
    va.textContent=a.toFixed(2);
    if(SOL.some(s=>Math.abs(deg-s.deg)<12)){ msg.className='msg near'; msg.textContent='もう少し！ 点 B を直線（点線）に乗せよう'; }
    else msg.className='msg';
  }

  function setDeg(d){
    d=((d%360)+360)%360;
    const s=SOL.find(s=>Math.abs(d-s.deg)<SNAP);
    slider.value = s ? s.deg : d;
    draw();
  }

  // ---- ドラッグ ----
  let dragging=false;
  const toMath = e => { const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)*W/r.width, py=(e.clientY-r.top)*H/r.height;
    return {x:(px-OX)/S, y:(OY-py)/S, px, py}; };
  cv.addEventListener('pointerdown',e=>{
    const m=toMath(e), B=posOf(+slider.value);
    const dB=Math.hypot(m.px-X(B.x),m.py-Y(B.y));
    const dCirc=Math.abs(Math.hypot(m.x-Ap.x,m.y-Ap.y)-RC)*S;
    if(dB<30||dCirc<20){dragging=true;cv.classList.add('drag');cv.setPointerCapture(e.pointerId);stopAnim();move(e);}
  });
  const move=e=>{ if(!dragging)return; const m=toMath(e); setDeg(Math.atan2(m.y-Ap.y,m.x-Ap.x)*180/Math.PI); };
  cv.addEventListener('pointermove',move);
  const up=()=>{dragging=false;cv.classList.remove('drag');};
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

  slider.addEventListener('input',()=>{stopAnim();setDeg(+slider.value);});

  // ---- アニメーション ----
  let raf=null;
  function stopAnim(){ if(raf){cancelAnimationFrame(raf);raf=null;} $('anim').textContent='▶ 自動で1周'; }
  function tween(to){
    stopAnim(); const from=+slider.value; const diff=((to-from+540)%360)-180; const t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/700), e=1-Math.pow(1-k,3);
      slider.value=k===1?to:((from+diff*e)%360+360)%360; draw(); raf=k<1?requestAnimationFrame(step):null;};
    raf=requestAnimationFrame(step);
  }
  $('go1').onclick=()=>tween(315);
  $('go2').onclick=()=>tween(225);
  $('reset').onclick=()=>{['tCand','tH','tBoth'].forEach(i=>$(i).checked=false);tween(270);};
  $('anim').onclick=()=>{
    if(raf){stopAnim();return;}
    $('anim').textContent='⏸ 停止'; let last=performance.now(), pause=0;
    const step=t=>{const dt=t-last;last=t;
      if(pause>0){pause-=dt;} else {
        const prev=+slider.value; let d=(prev+dt*0.03)%360;
        const hit=SOL.find(s=>prev<s.deg&amp;&amp;d>=s.deg);
        slider.value=hit?hit.deg:d; if(hit)pause=1500;
      }
      draw(); raf=requestAnimationFrame(step);};
    raf=requestAnimationFrame(step);
  };
  ['tCand','tH','tBoth'].forEach(i=>$(i).addEventListener('change',draw));

  // ---- タブ &amp; ステップ ----
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.pane').forEach(p=>p.style.display=p.id==='p-'+t.dataset.t?'block':'none');
  });
  document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{
    const steps=[...document.querySelectorAll(`.steps[data-g=&quot;${b.dataset.g}&quot;] .step`)];
    const n=steps.find(s=>!s.classList.contains('show'));
    if(!n){ steps.forEach((s,i)=>s.classList.toggle('show',i===0)); b.textContent='次のステップ ▶'; return; }
    n.classList.add('show');
    if(b.dataset.g==='sin' &amp;&amp; steps.indexOf(n)===2){ $('tH').checked=true; draw(); }
    if(n.classList.contains('ans'))tween(315);
    if(n.classList.contains('ans2'))tween(225);
    if(steps.every(s=>s.classList.contains('show'))) b.textContent='最初から ↺';
  });

  // ---- 入力：数値のみ（全角数字も半角に変換） ----
  ['q1','q2','q3','q4','q5','q6'].forEach(id=>{
    const el=$(id);
    el.addEventListener('input',()=>{
      const v=el.value
        .replace(/[０-９．]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
        .replace(/。/g,'.')
        .replace(/[^\d.]/g,'')
        .replace(/(\..*)\./g,'$1');
      if(v!==el.value) el.value=v;
    });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') $('check').click(); });
  });

  // ---- 答え合わせ（解1・解2の順番は入れ替わってもOK） ----
  $('check').onclick=()=>{
    const num=id=>parseFloat($(id).value);
    const ok=(v,t,tol)=>Math.abs(v-t)<=tol;
    const match=(i,j,k,s)=>ok(num(i),s.x,0.05)&amp;&amp;ok(num(j),s.A,0.5)&amp;&amp;ok(num(k),s.B,0.5);
    const r1=match('q1','q2','q3',SOL[0])||match('q1','q2','q3',SOL[1]);
    const r2=match('q4','q5','q6',SOL[0])||match('q4','q5','q6',SOL[1]);
    const same=r1&amp;&amp;r2&amp;&amp;Math.abs(num('q1')-num('q4'))<0.1;
    $('r1').textContent=r1?'⭕ 正解':'❌'; $('r1').style.color=r1?'#059669':'#dc2626';
    $('r2').textContent=r2&amp;&amp;!same?'⭕ 正解':(same?'❌ 解1と同じ':'❌'); $('r2').style.color=r2&amp;&amp;!same?'#059669':'#dc2626';
    if(r1&amp;&amp;r2&amp;&amp;!same){ $('tBoth').checked=true; draw(); }
  };

  draw();
})();
</script>
</body>
</html>
"></iframe>

  <div class="pager">
    <button id="prev">◀ 前へ</button>
    <button id="next">次へ ▶</button>
  </div>

<script>
(() => {
  const frames=[...document.querySelectorAll('iframe')];
  const btns=[...document.querySelectorAll('#nav button')];
  let cur=0;

  function fit(f){
    try{
      const d=f.contentDocument; if(!d||!d.body) return;
      f.style.height=(d.documentElement.scrollHeight+4)+'px';
    }catch(e){ f.style.height='1500px'; }
  }
  frames.forEach(f=>{
    f.addEventListener('load',()=>{
      fit(f);
      try{ new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body); }catch(e){}
    });
  });

  function show(i){
    cur=Math.max(0,Math.min(frames.length-1,i));
    frames.forEach((f,k)=>f.classList.toggle('on',k===cur));
    btns.forEach((b,k)=>b.classList.toggle('on',k===cur));
    document.getElementById('prev').disabled=cur===0;
    document.getElementById('next').disabled=cur===frames.length-1;
    history.replaceState(null,'','#'+(cur+1));
    setTimeout(()=>fit(frames[cur]),50);
    window.scrollTo({top:0});
  }
  btns.forEach(b=>b.onclick=()=>show(+b.dataset.i));
  document.getElementById('prev').onclick=()=>show(cur-1);
  document.getElementById('next').onclick=()=>show(cur+1);
  window.addEventListener('resize',()=>fit(frames[cur]));

  const h=parseInt(location.hash.slice(1),10);
  show(h>=1&&h<=frames.length ? h-1 : 0);
})();
</script>
